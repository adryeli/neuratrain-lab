services:
  neurotrain-lab:
    build:
      context: .
    image: neurotrain-lab:latest
    ports:
      - "8501:8501"
    volumes:
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
